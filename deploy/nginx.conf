# Aldine behind your own nginx (instead of the bundled Caddy).
#
# Drop this in /etc/nginx/sites-available/aldine.conf, adjust the domain and
# cert paths, then: ln -s into sites-enabled && nginx -t && systemctl reload nginx.
# Compose side: do NOT pass --profile tls; keep ALDINE_APP_BIND=127.0.0.1 in .env
# so only nginx faces the internet. The prod overlay's TRUST_PROXY=1 makes
# per-client rate limits honor X-Forwarded-For from this proxy.
#
# The two settings people miss:
#   - client_max_body_size: nginx defaults to 1m, which breaks project-ZIP
#     import and file uploads. The app accepts 32m in general and 81m on the
#     ZIP-import route (a 60 MB ZIP, base64-encoded, plus headroom); a lower
#     limit here turns a valid import into a bare 413 before the app sees it.
#   - WebSocket upgrade for /collab: without it, live collaboration silently
#     degrades (editor loads, cursors never appear).
#
# Sharing the host with other apps? Set ALDINE_BASE_PATH=/internal/aldine (or
# give ALDINE_PUBLIC_URL that path) and change the two location prefixes below
# to `/internal/aldine/` and `/internal/aldine/collab`, keeping proxy_pass
# without a URI so the prefix reaches the app unchanged. Do not rewrite the
# path in the proxy: the app expects to see it.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name aldine.example.com;
    return 301 https://$host$request_uri;
}

server {
    # nginx ≥1.25.1 prefers `listen 443 ssl;` + `http2 on;` — this combined
    # form works everywhere (deprecation warning on new versions, nothing more)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aldine.example.com;

    # e.g. via certbot --nginx, or point at your existing wildcard cert
    ssl_certificate     /etc/letsencrypt/live/aldine.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aldine.example.com/privkey.pem;

    client_max_body_size 81m;

    # everything (app, /api, /plugins) — one upstream, no path games
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # compiles answer within ~120s server-side; leave slack
        proxy_read_timeout 180s;
    }

    # collaboration WebSocket — long-lived connection, needs the upgrade headers
    location /collab {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
