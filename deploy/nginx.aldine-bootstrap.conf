# Port-80-only bootstrap vhost: serves the ACME HTTP-01 challenge for
# aldine.bubble-robotics.com so the FIRST certificate can be issued, then gets
# replaced by nginx.aldine.conf.
#
# Two reasons this file exists rather than a location bolted onto GitLab's own
# server block:
#   - an explicit server_name match beats whichever block is nginx's default
#     server, so the challenge does not depend on GitLab's generated config
#   - it references no certificate; nginx refuses to start when ssl_certificate
#     points at a file that does not exist yet, which is the chicken-and-egg
#     that blocks installing the real vhost first
server {
    listen 80;
    listen [::]:80;
    server_name aldine.bubble-robotics.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    # No HTTPS to redirect to yet.
    location / {
        return 404;
    }
}
