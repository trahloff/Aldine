# Aldine as a second vhost on GitLab Omnibus's bundled nginx, reachable from
# anywhere. Access control is entirely Google SSO (AUTH_ENABLED=1 +
# ALDINE_SSO_ONLY=1) — nginx does not filter by source address.
#
# Install: /etc/nginx/conf.d/aldine.conf on the GitLab host, then in
# /etc/gitlab/gitlab.rb:
#   nginx['custom_nginx_config'] = "include /etc/nginx/conf.d/*.conf;"
# followed by `gitlab-ctl reconfigure`.
#
# Compose side: no `--profile tls` (nginx is the proxy), ALDINE_APP_BIND=127.0.0.1
# and ALDINE_PORT=8090 in .env — 8080 is GitLab's Puma.

# Deliberately NOT named $connection_upgrade: GitLab's own nginx config defines
# a map by that name in the same http block, and duplicates are a hard error.
map $http_upgrade $aldine_connection_upgrade {
    default upgrade;
    ''      close;
}

# Sign-in attempts are cheap for us and cheap for an attacker; cap them so a
# credential-stuffing run cannot saturate the app. Generous enough that a real
# person clicking "Continue with Google" never notices.
limit_req_zone $binary_remote_addr zone=aldine_auth:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name aldine.bubble-robotics.com;

    # Certificate renewal must stay on port 80 — keep this above the redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx >= 1.25.1 prefers `listen 443 ssl;` + `http2 on;` — this combined
    # form works everywhere (deprecation warning on new versions, nothing more)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aldine.bubble-robotics.com;

    ssl_certificate     /etc/letsencrypt/live/aldine.bubble-robotics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aldine.bubble-robotics.com/privkey.pem;

    # nginx defaults to 1m, which breaks project-ZIP import and file uploads.
    client_max_body_size 32m;

    # everything (app, /api, /plugins) — one upstream, no path games
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # compiles answer within ~120s server-side; leave slack
        proxy_read_timeout 180s;
    }

    location /api/auth/ {
        limit_req zone=aldine_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # collaboration WebSocket — without the upgrade headers the editor loads
    # but live cursors never appear
    location /collab {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $aldine_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
