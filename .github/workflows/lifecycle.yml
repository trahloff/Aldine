name: Lifecycle

# What a self-hoster does with their data, on real images with accounts on,
# for the JSON and the Postgres datastore (scripts/lifecycle/drill.sh, which
# runs the same way locally):
#
#   upgrade  the previous release's images seed a stack; the candidate starts
#            on the same volumes and must find every account, file, commit,
#            branch, comment thread, share and token, and still typeset
#   restore  the candidate is seeded and backed up with deploy/backup.sh, the
#            stack and its volumes are deleted, deploy/restore.sh restores onto
#            an empty Docker as deploy/README.md says, and the same checks run
#
# release.yml calls this with the digests it just built, and promote waits for
# it: a release that loses data on upgrade or restore never becomes latest.
# Pull requests that touch storage run it too, on the PR's app image (built
# here, amd64 only, never pushed) and the released compiler.
on:
  workflow_call:
    inputs:
      app-image:
        description: App image under test, by digest
        required: true
        type: string
      compiler-image:
        description: Compiler image under test, by digest
        required: true
        type: string
      previous-version:
        description: Release the upgrade starts from (default the newest tag before this one)
        required: false
        type: string
        default: ''
  pull_request:
    paths:
      - apps/server/src/db/**
      - apps/server/src/store.ts
      - apps/server/src/collab.ts
      - apps/server/src/gitops.ts
      - apps/server/src/auth.ts
      - apps/server/src/config.ts
      - apps/server/Dockerfile
      - docker-compose.full.yml
      - deploy/docker-compose.prod.yml
      - deploy/backup.sh
      - deploy/restore.sh
      - scripts/lifecycle/**
      - .github/workflows/lifecycle.yml

permissions:
  contents: read

jobs:
  drill:
    name: ${{ matrix.drill }} (${{ matrix.datastore }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: lifecycle-${{ github.ref }}-${{ matrix.drill }}-${{ matrix.datastore }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        drill: [upgrade, restore]
        datastore: [json, postgres]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the previous release is the newest tag before this one
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Free runner disk for the compiler image
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
      - name: Build the app image of this pull request
        if: ${{ inputs.app-image == '' }}
        run: docker build -f apps/server/Dockerfile -t aldine-app:candidate .
      # Unset values fall back to the drill's defaults, which on a pull
      # request are right: the release docker-compose.yml pins is the one
      # users upgrade from, and its compiler is the one they run.
      - name: Drill
        run: |
          if [ -z "$PREVIOUS_VERSION" ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            PREVIOUS_VERSION=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^")
            export PREVIOUS_VERSION=${PREVIOUS_VERSION#v}
          fi
          scripts/lifecycle/drill.sh "$DRILL"
        env:
          DRILL: ${{ matrix.drill }}
          DATASTORE: ${{ matrix.datastore }}
          CANDIDATE_APP_IMAGE: ${{ inputs.app-image || 'aldine-app:candidate' }}
          CANDIDATE_COMPILER_IMAGE: ${{ inputs.compiler-image }}
          PREVIOUS_VERSION: ${{ inputs.previous-version }}
          ALDINE_REGISTRY: ghcr.io/${{ github.repository_owner }}
