name: MCP Registry

# Publishes server.json to the official MCP Registry
# (registry.modelcontextprotocol.io) as io.github.trahloff/aldine.
#
# GitHub OIDC grants io.github.<repository owner>/*, so no secret is involved.
# The entry lists remotes only (the demo and a template for your own
# instance), never an image tag, so it does not wait for `latest` to move.
#
# The registry refuses a version it already holds and never lets one change,
# so a release publishes its tag's version once; running this by hand on main
# publishes the current release only if it is not listed yet. Changing the
# entry between releases needs a new version (e.g. 1.5.0-1).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: v1.8.7
  # sha256 of mcp-publisher_linux_amd64.tar.gz, from that release's
  # registry_<version>_checksums.txt
  MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
  SERVER_NAME: io.github.trahloff/aldine

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Every version pin agrees (and with the tag, on a release)
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node scripts/check-release-pins.mjs --tag "$GITHUB_REF_NAME"
          else
            node scripts/check-release-pins.mjs
          fi
      - name: Stamp the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(jq -r .version package.json)"
          fi
          jq --arg v "$version" '.version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Skip a version the registry already holds
        id: listed
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="$(jq -rn --arg s "$SERVER_NAME" '$s|@uri')"
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/$name/versions/$VERSION")"
          case "$status" in
            200) echo "::notice::$SERVER_NAME $VERSION is already in the MCP Registry; nothing to publish"
                 echo "listed=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "listed=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::MCP Registry answered $status for $SERVER_NAME $VERSION"; exit 1 ;;
          esac
      - name: Install mcp-publisher
        if: steps.listed.outputs.listed == 'false'
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/$archive"
          echo "$MCP_PUBLISHER_SHA256  $archive" | sha256sum -c -
          tar xzf "$archive" mcp-publisher
          rm "$archive"
      - name: Validate
        if: steps.listed.outputs.listed == 'false'
        run: ./mcp-publisher validate server.json
      - name: Publish
        if: steps.listed.outputs.listed == 'false'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
