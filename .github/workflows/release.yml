name: Release

# A version tag builds; it does not publish to anyone.
#
#   git push origin v0.4.0
#     preflight  the tag is on main, and every version pin agrees with it
#     verify     the full CI suite, on the tagged commit (tags skip ci.yml's own triggers)
#     build      aldine-app, aldine-compiler and aldine-runner as 0.4.0 + sha-<commit>, immutable
#     smoke      boot those exact digests with the user-facing compose file and
#                typeset a document with a bibliography inside the sandbox
#     lifecycle  upgrade from the previous release onto those digests, and a
#                backup/restore drill, on the SQLite, the JSON and the
#                Postgres datastore
#     promote    waits for approval in the `latest` environment, then moves
#                `latest` to the same digests and publishes the GitHub Release
#
# Until promote is approved nothing a self-hoster pulls has changed. To roll
# back, run "Promote to latest" by hand with the previous version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag must point at a commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Merge first, then tag."
            exit 1
          fi
      - name: Version pins agree with the tag
        id: version
        run: |
          node scripts/check-release-pins.mjs --tag "$GITHUB_REF_NAME"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-app:
    needs: [preflight, verify]
    uses: ./.github/workflows/build-image.yml
    with:
      name: app
      context: .
      dockerfile: apps/server/Dockerfile
      version: ${{ needs.preflight.outputs.version }}
    secrets: inherit

  # The published default: scheme medium (curated packages, publisher classes,
  # most scripts). What `aldine-compiler:<version>` and `:latest` point at.
  build-compiler:
    needs: [preflight, verify]
    uses: ./.github/workflows/build-image.yml
    with:
      name: compiler
      context: apps/compiler
      dockerfile: apps/compiler/Dockerfile
      version: ${{ needs.preflight.outputs.version }}
      build-args: TEXLIVE_SCHEME=medium
    secrets: inherit

  # All of TeX Live, published as `<version>-full` / `latest-full`; a
  # self-hoster opts in with ALDINE_TEXLIVE=-full.
  build-compiler-full:
    needs: [preflight, verify]
    uses: ./.github/workflows/build-image.yml
    with:
      name: compiler
      context: apps/compiler
      dockerfile: apps/compiler/Dockerfile
      version: ${{ needs.preflight.outputs.version }}
      build-args: TEXLIVE_SCHEME=full
      tag-suffix: -full
      free-disk: true
    secrets: inherit

  # The runner, an experimental preview (docs/RUNNER.md): published with every
  # release so a self-hoster who adds deploy/docker-compose.runner.yml gets
  # the version matching the app.
  build-runner:
    needs: [preflight, verify]
    uses: ./.github/workflows/build-image.yml
    with:
      name: runner
      context: apps/runner
      dockerfile: apps/runner/Dockerfile
      version: ${{ needs.preflight.outputs.version }}
      build-args: VERSION=${{ needs.preflight.outputs.version }}
    secrets: inherit

  # Boots that exact digest with the overlay's security settings, checks the
  # container passes its own checks, and makes a PGF figure through the socket.
  smoke-runner:
    needs: [build-runner]
    runs-on: ubuntu-latest
    env:
      ALDINE_RUNNER_IMAGE: ghcr.io/${{ github.repository_owner }}/aldine-runner@${{ needs.build-runner.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      # A package GHCR has never seen before starts out private.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the runner with the overlay's settings
        run: docker compose -f docker-compose.yml -f deploy/docker-compose.runner.yml -f deploy/docker-compose.runner-smoke.yml up -d --quiet-pull runner
      - name: Smoke test
        run: |
          docker run --rm --network none -v aldine_aldine-runner-socket:/run/aldine-runner -v "$PWD:/repo:ro" \
            node:22-trixie-slim@sha256:68c76cfad89921b927eae28ba21407475e29d0ce450afcdbe70c1532db042b64 node /repo/scripts/smoke-runner.mjs
      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.yml -f deploy/docker-compose.runner.yml -f deploy/docker-compose.runner-smoke.yml logs --no-color runner | tail -100

  smoke:
    needs: [preflight, build-app, build-compiler, build-compiler-full]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: medium
            compiler: ${{ needs.build-compiler.outputs.digest }}
          - variant: full
            compiler: ${{ needs.build-compiler-full.outputs.digest }}
    name: smoke (${{ matrix.variant }})
    env:
      ALDINE_APP_IMAGE: ghcr.io/${{ github.repository_owner }}/aldine-app@${{ needs.build-app.outputs.digest }}
      ALDINE_COMPILER_IMAGE: ghcr.io/${{ github.repository_owner }}/aldine-compiler@${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Free runner disk for the compiler image
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
      - name: Start the stack from the published digests
        run: docker compose -f docker-compose.yml -f deploy/docker-compose.smoke.yml up -d --quiet-pull
      - name: Smoke test
        run: node scripts/smoke-image.mjs
        env:
          ALDINE_URL: http://localhost:8080
          EXPECT_SCHEME: ${{ matrix.variant }}
      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.yml -f deploy/docker-compose.smoke.yml logs --no-color | tail -200
      - name: Summary
        run: |
          {
            echo "Smoke passed against:"
            echo "- $ALDINE_APP_IMAGE"
            echo "- $ALDINE_COMPILER_IMAGE"
            echo
            echo "Next: approve the promote job to move \`latest\` here, or leave it and nothing changes for users."
          } >> "$GITHUB_STEP_SUMMARY"

  lifecycle:
    needs: [build-app, build-compiler]
    uses: ./.github/workflows/lifecycle.yml
    with:
      app-image: ghcr.io/${{ github.repository_owner }}/aldine-app@${{ needs.build-app.outputs.digest }}
      compiler-image: ghcr.io/${{ github.repository_owner }}/aldine-compiler@${{ needs.build-compiler.outputs.digest }}

  promote:
    needs: [preflight, smoke, smoke-runner, lifecycle]
    uses: ./.github/workflows/promote.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
    secrets: inherit
