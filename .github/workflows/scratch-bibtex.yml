name: Scratch bibtex
on:
  push:
    branches: [venue-kits-172]
    paths: [.github/workflows/scratch-bibtex.yml]
permissions:
  contents: read
jobs:
  bib:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          set -x
          sudo apt-get update -qq && sudo apt-get install -y -qq texlive-binaries >/dev/null
          cd "$RUNNER_TEMP" && curl -sSL -o k.zip https://authors.wiley.com/asset/WileyDesign.zip && unzip -q k.zip
          cd Optimal-Design-layout
          grep -c citation Optimal-Design-layout.aux || true
          cat Optimal-Design-layout.blg | head -60
          for v in wileyNJD-Chicago wileyNJD-Chicago-lastoo; do
            echo "##### $v"
            mkdir -p "../t-$v" && cp Optimal-Design-layout.aux wileyNJD-Chicago.bib "../t-$v/" && cp "$v.bst" "../t-$v/wileyNJD-Chicago.bst"
            ( cd "../t-$v" && bibtex Optimal-Design-layout; cat Optimal-Design-layout.blg | head -80 )
          done
