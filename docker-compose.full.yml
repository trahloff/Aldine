name: aldine

services:
  app:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      # bind to all interfaces by default (local dev); set ALDINE_APP_BIND=127.0.0.1
      # in production so only the Caddy reverse proxy faces the internet.
      # ALDINE_PORT changes the host port if 8080 is taken.
      - "${ALDINE_APP_BIND:-0.0.0.0}:${ALDINE_PORT:-8080}:3000"
    environment:
      DATA_DIR: /data
      META_DIR: /secrets
      COMPILER_URL: http://compiler:4020
      # Optional AI error-fix (bring your own key). Precedence when several are
      # set: OPENROUTER_API_KEY > OPENAI_API_KEY > ANTHROPIC_API_KEY. Unset = disabled.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ALDINE_AI_MODEL: ${ALDINE_AI_MODEL:-}
      ALDINE_AI_BASE_URL: ${ALDINE_AI_BASE_URL:-}
      # Optional multi-user auth. AUTH_ENABLED=1 turns on login + per-project access.
      AUTH_ENABLED: ${AUTH_ENABLED:-}
      # ALDINE_SSO_ONLY=1 disables password sign-in entirely (SSO only; no SMTP needed).
      ALDINE_SSO_ONLY: ${ALDINE_SSO_ONLY:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # GitHub login (SSO) — separate from GitHub sync below.
      GITHUB_LOGIN_CLIENT_ID: ${GITHUB_LOGIN_CLIENT_ID:-}
      GITHUB_LOGIN_CLIENT_SECRET: ${GITHUB_LOGIN_CLIENT_SECRET:-}
      # ORCID login (SSO): a Public API client from orcid.org/developer-tools.
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID:-}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET:-}
      ORCID_SANDBOX: ${ORCID_SANDBOX:-}
      # GitHub sync (repo import/push/pull) — OAuth app with repo scope.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ALDINE_PUBLIC_URL: ${ALDINE_PUBLIC_URL:-}
      ALDINE_BASE_PATH: ${ALDINE_BASE_PATH:-}
      # Optional outbound email for password resets: SMTP (any provider) or AWS
      # SES (SES_FROM + AWS_REGION). Without a transport, reset tokens are
      # logged server-side instead of emailed.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SES_FROM: ${SES_FROM:-}
      AWS_REGION: ${AWS_REGION:-}
      # Optional error tracking.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # Public-demo hardening: comma-separated project ids everyone may read
      # and typeset but nobody may edit; per-client typeset budget per minute.
      ALDINE_PROTECTED_PROJECTS: ${ALDINE_PROTECTED_PROJECTS:-}
      ALDINE_COMPILE_PER_MIN: ${ALDINE_COMPILE_PER_MIN:-}
      # Optional: share rate limits across app nodes (see the `redis` profile).
      REDIS_URL: ${REDIS_URL:-}
      # Datastore: blank = flat JSON files (slim single-node default). Set to a
      # Postgres URL for the horizontally-scalable backend (see `postgres` profile).
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - aldine-data:/data
      - aldine-secrets:/secrets
    depends_on:
      compiler:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    init: true # reap orphaned git/compile children (node runs as PID 1 otherwise)
    networks:
      - frontend
      - backend

  compiler:
    build:
      context: apps/compiler
      args:
        # medium (default, ~1 GB + pinned extras) or full (all of CTAN, ~9 GB on disk):
        #   ALDINE_TEXLIVE_SCHEME=full docker compose up -d --build
        TEXLIVE_SCHEME: ${ALDINE_TEXLIVE_SCHEME:-medium}
    environment:
      DATA_DIR: /data
      COMPILE_TIMEOUT_MS: ${COMPILE_TIMEOUT_MS:-120000}
      MAX_CONCURRENT_COMPILES: ${MAX_CONCURRENT_COMPILES:-2}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4020/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - aldine-data:/data
    # Hardening: no external egress (internal network), drop all Linux caps,
    # no privilege escalation, bounded CPU/memory/PIDs. Packages are baked into
    # the image at build time, so the compiler never needs the network.
    networks:
      - backend
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    init: true # reap orphaned pdflatex/biber children left by killed latexmk runs
    restart: unless-stopped

  # TLS reverse proxy — opt in with `--profile tls` and set ALDINE_DOMAIN.
  # Caddy auto-provisions HTTPS certificates for the domain.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      ALDINE_DOMAIN: ${ALDINE_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - frontend

  # Optional Redis for cross-node rate limiting. Enable with `--profile redis`
  # and set REDIS_URL=redis://redis:6379 in .env.
  redis:
    # Pinned to the last BSD-3 release: Redis 7.4 moved to RSALv2/SSPL, and the
    # floating 7-alpine tag would pull that in silently.
    image: redis:7.2-alpine
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    networks:
      - backend

  # Optional Postgres for the scalable datastore. Enable with `--profile postgres`
  # and set DATABASE_URL=postgres://aldine:aldine@db:5432/aldine in .env.
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aldine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aldine}
      POSTGRES_DB: ${POSTGRES_DB:-aldine}
    volumes:
      - aldine-pg:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - backend

networks:
  frontend: {}
  backend:
    internal: true   # compiler (and db) have no route to the internet

volumes:
  aldine-data:
  aldine-secrets:
  aldine-pg:
  caddy-data:
  caddy-config:
