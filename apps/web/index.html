<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Instances hold private documents; the public face for search engines is aldine.dev. -->
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <title>Aldine</title>
    <!-- Apply the theme before first paint (dark is the default; a stored choice wins). -->
    <script>document.documentElement.dataset.theme = localStorage.getItem('aldine.theme') === 'light' ? 'light' : 'dark';</script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128220;</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
