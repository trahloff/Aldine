<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aldine PDF viewer</title>
<!--
  Aldine PDF viewer (MCP App, ui://aldine/pdf-viewer). Generated by
  apps/server/viewer/build.mjs — do not edit; edit viewer/src and rebuild.
  Bundles pdf.js (Mozilla, Apache-2.0) and @modelcontextprotocol/ext-apps (MIT).
-->
<style>
/*__STYLE__*/
</style>
</head>
<body>
<div class="viewer" data-testid="pdf-viewer" data-state="waiting">
  <div class="status" data-testid="viewer-status"><span class="file">Waiting for the compile result…</span></div>
  <section class="errors" data-testid="viewer-errors" data-open="false" hidden>
    <button type="button" class="errors-head" data-testid="viewer-errors-toggle" aria-expanded="false">
      <span class="chev">▸</span><span class="errors-summary"></span>
    </button>
    <ul class="errors-list" data-testid="viewer-errors-list"></ul>
  </section>
  <div class="notice" data-testid="viewer-notice"><span class="spinner"></span><span class="text">Waiting for the compile result…</span></div>
  <div class="pages" data-testid="viewer-pages" hidden></div>
  <div class="bar" data-testid="viewer-bar">
    <div class="group navgroup">
      <button type="button" class="prev" data-testid="viewer-prev" title="Previous page" aria-label="Previous page" disabled>‹</button>
      <span class="count" data-testid="viewer-page-count" aria-live="polite">– / –</span>
      <button type="button" class="next" data-testid="viewer-next" title="Next page" aria-label="Next page" disabled>›</button>
    </div>
    <div class="group zoomgroup">
      <button type="button" class="zoom-out" data-testid="viewer-zoom-out" title="Zoom out" aria-label="Zoom out" disabled>−</button>
      <button type="button" class="zoom" data-testid="viewer-zoom" title="Reset to fit width" aria-label="Zoom 100% — reset to fit width" disabled>100%</button>
      <button type="button" class="zoom-in" data-testid="viewer-zoom-in" title="Zoom in" aria-label="Zoom in" disabled>+</button>
    </div>
    <span class="spacer"></span>
    <button type="button" class="expand" data-testid="viewer-expand" title="Expand" aria-label="Expand" hidden>⤢</button>
    <a class="open" data-testid="viewer-open" href="#" target="_blank" rel="noopener noreferrer" hidden>Open in Aldine</a>
  </div>
</div>
<script>
/*__SCRIPT__*/
</script>
</body>
</html>
